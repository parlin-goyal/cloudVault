# Nginx on EC2:
#   - serves the built React app from /var/www/cloudvault
#   - forwards /api requests to the Express server on port 5000
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/cloudvault;
    index index.html;

    # Must be larger than MAX_FILE_SIZE_MB in server/.env
    client_max_body_size 30M;

    # Express API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Built JS/CSS files have unique names, so they can be cached for a long time
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: send every other path to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
